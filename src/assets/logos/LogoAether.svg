<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <defs>
    <linearGradient id="aetherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3A8C"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00C8D4"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal network icon, center at (40, 40), outer radius 28 -->

  <!-- Outer connecting lines between adjacent outer nodes -->
  <line x1="40" y1="12" x2="64.2" y2="26" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="64.2" y1="26" x2="64.2" y2="54" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="64.2" y1="54" x2="40" y2="68" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="68" x2="15.8" y2="54" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="15.8" y1="54" x2="15.8" y2="26" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="15.8" y1="26" x2="40" y2="12" stroke="url(#aetherGrad)" stroke-width="2"/>

  <!-- Inner hexagon lines (center to mid-points) -->
  <line x1="40" y1="40" x2="40" y2="12" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="40" x2="64.2" y2="26" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="40" x2="64.2" y2="54" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="68" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="40" x2="15.8" y2="54" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="40" x2="15.8" y2="26" stroke="url(#aetherGrad)" stroke-width="2"/>

  <!-- Extra outer arms extending beyond the hexagon -->
  <line x1="40" y1="12" x2="40" y2="4" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="64.2" y1="26" x2="71.1" y2="22" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="64.2" y1="54" x2="71.1" y2="58" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="40" y1="68" x2="40" y2="76" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="15.8" y1="54" x2="8.9" y2="58" stroke="url(#aetherGrad)" stroke-width="2"/>
  <line x1="15.8" y1="26" x2="8.9" y2="22" stroke="url(#aetherGrad)" stroke-width="2"/>

  <!-- Outer tip dots -->
  <circle cx="40" cy="4" r="3.5" fill="url(#aetherGrad)"/>
  <circle cx="71.1" cy="22" r="3.5" fill="url(#aetherGrad)"/>
  <circle cx="71.1" cy="58" r="3.5" fill="url(#aetherGrad)"/>
  <circle cx="40" cy="76" r="3.5" fill="url(#aetherGrad)"/>
  <circle cx="8.9" cy="58" r="3.5" fill="url(#aetherGrad)"/>
  <circle cx="8.9" cy="22" r="3.5" fill="url(#aetherGrad)"/>

  <!-- Hexagon vertex dots -->
  <circle cx="40" cy="12" r="4" fill="url(#aetherGrad)"/>
  <circle cx="64.2" cy="26" r="4" fill="url(#aetherGrad)"/>
  <circle cx="64.2" cy="54" r="4" fill="url(#aetherGrad)"/>
  <circle cx="40" cy="68" r="4" fill="url(#aetherGrad)"/>
  <circle cx="15.8" cy="54" r="4" fill="url(#aetherGrad)"/>
  <circle cx="15.8" cy="26" r="4" fill="url(#aetherGrad)"/>

  <!-- Center dot -->
  <circle cx="40" cy="40" r="5" fill="url(#aetherGrad)"/>

  <!-- Text: AETHER -->
  <text x="90" y="36" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#1A1A1A" letter-spacing="1">AETHER</text>
  <!-- Text: ERP -->
  <text x="90" y="58" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="url(#aetherGrad)" letter-spacing="3">ERP</text>
</svg>
